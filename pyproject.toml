[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "watermark-ia-detector-mcp"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["watermark-detector", "mcp>=2.3,<3"]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "pillow>=12,<13", "cryptography>=50"]

[project.scripts]
wmd-mcp = "watermark_ia_detector_mcp.server:main"

[tool.uv.sources]
watermark-detector = { path = "../watermark-detector", editable = true }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra"
